<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtual Screen Board - Air Canvas</title>
  <link rel="stylesheet" href="style.css" />
  <!-- MediaPipe Camera & Hands Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="hud">
    <div id="status-mode">MODE: HOVER / AIM</div>
    <div id="status-left">LEFT COMMAND: NONE</div>
  </div>

  <div class="toolbar">
    <button class="tool-btn" data-color="#ff0000" style="border-color: #ff0000;">RED</button>
    <button class="tool-btn" data-color="#00ff00" style="border-color: #00ff00;">GREEN</button>
    <button class="tool-btn active" data-color="#0000ff" style="border-color: #0000ff;">BLUE</button>
    <button class="tool-btn" data-color="#ffff00" style="border-color: #ffff00;">YELLOW</button>
    <button class="tool-btn clear-btn" id="clear-btn">CLEAR</button>
  </div>

  <div class="viewport">
    <video id="webcam" playsinline></video>
    <canvas id="paint-canvas"></canvas>
    <canvas id="pointer-canvas"></canvas>
  </div>

  <script src="app.js"></script>
</body>
</html>
